[workspace]
members = [
    "packages/game-engine/crates/compiler",
    "packages/game-engine/crates/contracts",
    "packages/game-engine/crates/core",
    "packages/game-engine/crates/env",
    "packages/game-engine/crates/observe",
    "packages/game-engine/crates/oracle-ast",
    "packages/game-engine/crates/sim",
    "packages/game-engine/crates/view",
    "packages/game-engine/crates/witness",
    "packages/game-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
mtg-view = { path = "packages/game-engine/crates/view" }
mtg-observe = { path = "packages/game-engine/crates/observe" }
mtg-sim = { path = "packages/game-engine/crates/sim" }

serde = { version = "1.0", features = ["derive"] }
# float_roundtrip unifies serde_json with the host's jsonschema feature set, so
# every selection (one crate or the workspace) shares one compiled copy.
serde_json = { version = "1.0", features = ["raw_value", "float_roundtrip"] }
schemars = "=1.2.3"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
mtg-contracts = { path = "packages/game-engine/crates/contracts" }
mtg-oracle-ast = { path = "packages/game-engine/crates/oracle-ast" }
mtg-compiler = { path = "packages/game-engine/crates/compiler" }
mtg-core = { path = "packages/game-engine/crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The gate denies every other Clippy warning. These two would reshape rules
# data (boxing snapshot-bearing enum variants) or long-standing internal call
# signatures; neither signals a defect.
[workspace.lints.clippy]
large_enum_variant = "allow"
too_many_arguments = "allow"

[profile.release]
overflow-checks = true

# One debug profile for check, Clippy, tests and the edit loop: `test` inherits
# `dev`, so every command shares dependency artifacts and incremental state.
# Line tables keep backtrace locations; full debug info cost ~18% compiler CPU.
# https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
debug = "line-tables-only"

# External packages are optimized once per worktree and carry no debug info.
# https://doc.rust-lang.org/cargo/reference/profiles.html#overrides
[profile.dev.package."*"]
opt-level = 2
debug = false

# The rules hot path. Measured once in the single gate shape (jobs 8, 32
# threads; generated/phase2d-1/opt-trial2.txt): build + unit + all 27
# integration binaries took 304.8 s at opt-level 0 (30.3+101.8+172.7), 80.6 s at
# 1 (29.3+19.2+32.1; its lib/bin artifacts were already built, a full member
# rebuild measured 84.7 s in opt-trial.txt) and 199.2 s at 2 (153.6+16.8+28.8).
[profile.dev.package.mtg-core]
opt-level = 1

[profile.dev.package.mtg-contracts]
opt-level = 1
