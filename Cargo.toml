[workspace]
members = ["packages/game-engine/crates/contracts", "packages/game-engine/crates/compiler", "packages/game-engine/crates/core", "packages/game-engine/crates/sim", "packages/game-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
schemars = "=1.2.3"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
mtg-contracts = { path = "packages/game-engine/crates/contracts" }
mtg-compiler = { path = "packages/game-engine/crates/compiler" }
mtg-core = { path = "packages/game-engine/crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true

# Optimize runtime-heavy verification while retaining development checks.
# Line tables keep backtrace locations; full debug info cost ~18% compiler CPU
# and ~2.6 GiB peak rustc RSS (generated/phase1-cargo-speedup receipts).
# Incremental comes from the dev profile default.
# https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.test]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# Focused development tests favor compile time and keep backtrace locations.
[profile.quick]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
