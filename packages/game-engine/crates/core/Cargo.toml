[package]
name = "mtg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mtg-view.workspace = true
mtg-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

rand_chacha = { version = "=0.10.0", default-features = false }
rand_core = { version = "=0.10.0", default-features = false }

# Data embedding only: no engine types, so mtg-contracts compiles once.
[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

# Integration-test harness surface (src/testkit.rs). Never a default feature and
# never enabled by production crates; scripts/engine-structure-check.py enforces it.
[features]
testkit = ["mtg-view/test-intents"]

[dev-dependencies]
mtg-view = { workspace = true, features = ["test-intents"] }

[[test]]
name = "rules"
required-features = ["testkit"]

[[test]]
name = "recovery"
required-features = ["testkit"]
