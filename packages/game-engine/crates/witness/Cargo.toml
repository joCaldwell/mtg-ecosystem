[package]
name = "mtg-witness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Development-only witness binaries: exact frozen card source compiled by
# mtg-compiler and run through mtg-core's `testkit` surface. No production crate
# depends on this package, and engine build identity excludes it.
[dependencies]
mtg-compiler.workspace = true
mtg-contracts.workspace = true
mtg-core = { workspace = true, features = ["testkit"] }
mtg-observe.workspace = true
serde.workspace = true
serde_json.workspace = true
rand_chacha = { version = "=0.10.0", default-features = false }
rand_core = { version = "=0.10.0", default-features = false }

[lints]
workspace = true

[lib]
test = false
doctest = false
